name: Build Armbian sunxi 5.15.93 module

on:
  workflow_dispatch:
    inputs:
      kernel_release:
        description: Kernel release to package for
        required: true
        default: 5.15.93-sunxi
      headers_package_version:
        description: Armbian linux-headers-current-sunxi package version
        required: true
        default: 23.02.2
      headers_deb_url:
        description: Optional direct URL to linux-headers-current-sunxi .deb
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            curl \
            dpkg-dev \
            flex \
            gcc-arm-linux-gnueabihf \
            kmod \
            libelf-dev \
            libssl-dev \
            xz-utils

      - name: Download Armbian kernel headers
        env:
          HEADERS_DEB_URL: ${{ inputs.headers_deb_url }}
          HEADERS_PACKAGE_VERSION: ${{ inputs.headers_package_version }}
        run: |
          set -euo pipefail
          mkdir -p kernel-debs

          if [ -n "$HEADERS_DEB_URL" ]; then
            curl -fsSL "$HEADERS_DEB_URL" -o kernel-debs/linux-headers-current-sunxi.deb
          else
            curl -fsSL https://apt.armbian.com/armbian.key \
              | sudo gpg --dearmor -o /usr/share/keyrings/armbian.gpg
            echo "deb [arch=armhf signed-by=/usr/share/keyrings/armbian.gpg] https://apt.armbian.com jammy main" \
              | sudo tee /etc/apt/sources.list.d/armbian.list
            sudo apt-get update
            apt-cache madison linux-headers-current-sunxi:armhf || true
            if ! apt-get download "linux-headers-current-sunxi:armhf=$HEADERS_PACKAGE_VERSION"; then
              echo "::error::Could not download linux-headers-current-sunxi:$HEADERS_PACKAGE_VERSION from the current Armbian APT index. Re-run the workflow with headers_deb_url pointing to the exact 5.15.93-sunxi headers .deb from your image or an archive mirror."
              exit 1
            fi
            mv linux-headers-current-sunxi_*_armhf*.deb kernel-debs/linux-headers-current-sunxi.deb
          fi

          echo "HEADERS_DEB=$PWD/kernel-debs/linux-headers-current-sunxi.deb" >> "$GITHUB_ENV"

      - name: Extract kernel headers
        env:
          KERNEL_RELEASE: ${{ inputs.kernel_release }}
        run: |
          set -euo pipefail
          mkdir -p kernel-headers
          dpkg-deb -x kernel-debs/linux-headers-current-sunxi.deb kernel-headers

          headers_dir="$(find "$PWD/kernel-headers/usr/src" -maxdepth 1 -type d -name "linux-headers-$KERNEL_RELEASE*" | head -n1)"
          if [ -z "$headers_dir" ]; then
            headers_dir="$(find "$PWD/kernel-headers/usr/src" -maxdepth 1 -type d -name "linux-headers-*sunxi*" | head -n1)"
          fi
          if [ -z "$headers_dir" ]; then
            echo "Could not find extracted sunxi kernel headers" >&2
            find "$PWD/kernel-headers" -maxdepth 4 -type d >&2
            exit 1
          fi

          echo "KSRC=$headers_dir" >> "$GITHUB_ENV"
          echo "Using headers: $headers_dir"

      - name: Select H3 mainline config
        run: |
          set -euo pipefail
          cp platforms/h3-mainline.cfg ssv6x5x.cfg
          cp platforms/h3-mainline-wifi.cfg ssv6x5x-wifi.cfg
          cp platforms/h3-mainline-generic-wlan.c ssv6x5x-generic-wlan.c
          chmod +x parser-conf.sh

      - name: Build module
        run: |
          set -euo pipefail
          make -j"$(nproc)" \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            KSRC="$KSRC" \
            CONFIG_SSV6X5X=m \
            modules
          arm-linux-gnueabihf-strip --strip-unneeded ssv6x5x.ko
          modinfo ssv6x5x.ko

      - name: Package artifact
        env:
          KERNEL_RELEASE: ${{ inputs.kernel_release }}
        run: |
          set -euo pipefail
          artifact="ssv6x5x-armbian-${KERNEL_RELEASE}"
          mkdir -p "$artifact/lib/modules/${KERNEL_RELEASE}/extra"
          mkdir -p "$artifact/lib/firmware"

          install -m 0644 ssv6x5x.ko "$artifact/lib/modules/${KERNEL_RELEASE}/extra/ssv6x5x.ko"
          install -m 0644 image/ssv6x5x-sw.bin "$artifact/lib/firmware/ssv6x5x-sw.bin"
          install -m 0644 ssv6x5x-wifi.cfg "$artifact/lib/firmware/ssv6x5x-wifi.cfg"
          install -m 0644 README.armbian-sunxi.md "$artifact/README.armbian-sunxi.md"

          tar -czf "${artifact}.tar.gz" "$artifact"
          sha256sum "${artifact}.tar.gz" > "${artifact}.tar.gz.sha256"

      - name: Package headers installer
        env:
          KERNEL_RELEASE: ${{ inputs.kernel_release }}
        run: |
          set -euo pipefail
          artifact="armbian-sunxi-${KERNEL_RELEASE}-headers-installer"
          mkdir -p "$artifact/debs"

          install -m 0644 "$HEADERS_DEB" "$artifact/debs/"
          cat > "$artifact/install-headers.sh" <<'EOF'
          #!/bin/sh
          set -eu

          kernel_release="${KERNEL_RELEASE:-5.15.93-sunxi}"
          script_dir="$(cd "$(dirname "$0")" && pwd)"
          deb="$(find "$script_dir/debs" -maxdepth 1 -type f -name 'linux-headers-*.deb' | sort | tail -n 1)"

          if [ -z "$deb" ]; then
            echo "No linux-headers .deb found in $script_dir/debs" >&2
            exit 1
          fi

          if [ "$(uname -r)" != "$kernel_release" ] && [ "${FORCE:-0}" != "1" ]; then
            echo "Running kernel is $(uname -r), expected $kernel_release." >&2
            echo "Set FORCE=1 to install anyway." >&2
            exit 1
          fi

          sudo_cmd=""
          if [ "$(id -u)" -ne 0 ]; then
            sudo_cmd="sudo"
          fi

          $sudo_cmd dpkg -i "$deb" || $sudo_cmd apt-get -f install -y

          if ls -d "/usr/src/linux-headers-$kernel_release"* >/dev/null 2>&1; then
            echo "Installed headers for $kernel_release."
          else
            echo "Installed the package, but /usr/src/linux-headers-$kernel_release was not found." >&2
            exit 1
          fi
          EOF
          sed -i 's/^          //' "$artifact/install-headers.sh"
          chmod +x "$artifact/install-headers.sh"
          tar -czf "${artifact}.tar.gz" "$artifact"
          sha256sum "${artifact}.tar.gz" > "${artifact}.tar.gz.sha256"

      - name: Upload module package
        uses: actions/upload-artifact@v4
        with:
          name: ssv6x5x-armbian-${{ inputs.kernel_release }}
          path: |
            ssv6x5x-armbian-${{ inputs.kernel_release }}.tar.gz
            ssv6x5x-armbian-${{ inputs.kernel_release }}.tar.gz.sha256
          if-no-files-found: error

      - name: Upload headers installer
        uses: actions/upload-artifact@v4
        with:
          name: armbian-sunxi-${{ inputs.kernel_release }}-headers-installer
          path: |
            armbian-sunxi-${{ inputs.kernel_release }}-headers-installer.tar.gz
            armbian-sunxi-${{ inputs.kernel_release }}-headers-installer.tar.gz.sha256
          if-no-files-found: error
